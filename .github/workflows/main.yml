name: Build Linux Desktop

on:
  push:
    branches: [ rustpush ]
  pull_request:
    branches: [ rustpush ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Critical if rustpush or other Rust parts are submodules

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable  # Or match your project's Flutter version
          cache: true

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy  # If needed

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get Flutter deps
        run: flutter pub get

      - name: Build Rust native parts (if cargo project in subdir)
        run: |
          cd rustpush  # Or whatever the Rust crate dir is; adjust if needed
          cargo build --release

      - name: Build Flutter Linux
        run: flutter build linux --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbubbles-linux
          path: build/linux/x64/release/bundle/
