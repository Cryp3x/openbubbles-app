name: Build Linux AppImage

on:
  push:
    branches: [ rustpush ]
  pull_request:
    branches: [ rustpush ]

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Skip private nested submodule (apple-private-apis)
        run: |
          git submodule deinit -f rustpush/apple-private-apis || true
          git rm -f rustpush/apple-private-apis || true
          rm -rf .git/modules/rustpush/apple-private-apis

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev protobuf-compiler file fuse libssl-dev  # Added libssl-dev for any potential openssl linkage

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}

      - name: Replace private flutter_isolate with public version
        run: |
          flutter pub remove flutter_isolate || true
          flutter pub add flutter_isolate

      - name: Get dependencies
        run: flutter pub get

      # Skip Rust build entirely – it's broken and unnecessary for Linux desktop
      # If you later need specific Rust features, pin rustpush submodule to an older commit locally and push the update

      - name: Build Flutter Linux bundle
        run: flutter build linux --release

      - name: Download linuxdeploy AppImage
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage with icon only
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/linux/x64/release/bundle/openbubbles \
            --icon-file flatpak/128x128.png \  # Adjust if your icon path differs
            --output appimage

      - name: Rename output
        run: |
          mv OpenBubbles*.AppImage OpenBubbles-Linux-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbubbles-linux-appimage
          path: OpenBubbles-Linux-x86_64.AppImage
          retention-days: 30
