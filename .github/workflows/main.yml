name: Build Linux AppImage

on:
  push:
    branches: [ rustpush ]
  pull_request:
    branches: [ rustpush ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Skip private nested submodule
        run: |
          git submodule deinit -f rustpush/apple-private-apis || true
          git rm -f rustpush/apple-private-apis || true
          rm -rf .git/modules/rustpush/apple-private-apis

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev protobuf-compiler file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}

      - name: Replace private flutter_isolate
        run: |
          flutter pub remove flutter_isolate || true
          flutter pub add flutter_isolate

      - name: Get dependencies
        run: flutter pub get

      - name: Build Rust parts
        run: |
          cd rustpush || cd rust || true
          cargo build --release

      - name: Build Flutter Linux bundle
        run: flutter build linux --release

      - name: Download linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/linux/x64/release/bundle/openbubbles -i linux/icon.png -d linux/openbubbles.desktop --output appimage
          # Adjust icon/desktop file paths if needed – copy your app's icon to root as icon.png and create a basic .desktop file

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: openbubbles-linux-appimage
          path: OpenBubbles*.AppImage
          retention-days: 30
